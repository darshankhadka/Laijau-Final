; ==============================================================================
; Laijau ERP — Production OPcache Tuning
; Bytecode Cache Optimized for High-Performance Production Workloads
; ==============================================================================

[opcache]
opcache.enable = 1
opcache.enable_cli = 1

; Memory Allocation
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Invalidation Policy: Zero Disk I/O in Production
; Code changes require atomic release symlink flip + PHP-FPM reload
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Performance optimizations
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.enable_file_override = 1
opcache.jit = 1255
opcache.jit_buffer_size = 64M
