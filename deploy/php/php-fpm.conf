; ==============================================================================
; Laijau ERP — Production PHP-FPM Configuration
; Optimized for High-Concurrency ERP Transactions & Background Processing
; ==============================================================================

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Management: dynamic allocation with bounded limits
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20

; Memory protection: recycle worker process after 500 requests to eliminate memory fragmentation
pm.max_requests = 500

; Execution timeout guards
request_terminate_timeout = 120s
request_slowlog_timeout = 5s
slowlog = /var/log/php-fpm/slow.log

; Logging
catch_workers_output = yes
decorate_workers_output = no

; Health check / status endpoints
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

; Resource limits
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 25M
php_admin_value[post_max_size] = 25M
php_admin_value[max_execution_time] = 120
php_admin_value[expose_php] = Off
