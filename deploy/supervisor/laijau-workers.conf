# ==============================================================================
# Laijau — Production Supervisor Configuration
# Location: /etc/supervisor/conf.d/laijau-workers.conf
# ==============================================================================

# 1. High-Priority & Default Queue Worker Pool
[program:laijau-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/laijau/current/artisan queue:work --queue=high,default,accounting,fulfillment --sleep=3 --tries=3 --max-time=3600 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/laijau/shared/storage/logs/worker-default.log
stopwaitsecs=3600

# 2. Fulfillment & Courier Webhook Dispatch Worker Pool
[program:laijau-worker-fulfillment]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/laijau/current/artisan queue:work --queue=fulfillment,default --sleep=3 --tries=3 --max-time=3600 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/laijau/shared/storage/logs/worker-fulfillment.log
stopwaitsecs=3600
