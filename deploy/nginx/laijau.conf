# ==============================================================================
# Laijau — Production Nginx Server Configuration
# Domain: laijau.com & www.laijau.com
# Optimized for High Security, Concurrency, and Fast Page Loads
# ==============================================================================

# Rate limiting definitions (placed in http context or top of conf)
limit_req_zone $binary_remote_addr zone=laijau_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=laijau_checkout:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=laijau_login:10m rate=10r/m;

# Upstream PHP-FPM FastCGI backend (adjust socket or 127.0.0.1:9000 as configured)
upstream php_fpm_laijau {
    server unix:/run/php/php8.4-fpm.sock;
    # Or for TCP: server 127.0.0.1:9000;
    keepalive 32;
}

# --- 1. HTTP -> HTTPS Redirect Block ---
server {
    listen 80;
    listen [::]:80;
    server_name laijau.com www.laijau.com;

    # Allow Let's Encrypt / Certbot renewal challenges
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/laijau/current/public;
        allow all;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://laijau.com$request_uri;
    }
}

# --- 2. Canonical www -> non-www HTTPS Redirect Block ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.laijau.com;

    ssl_certificate /etc/letsencrypt/live/laijau.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laijau.com/privkey.pem;

    return 301 https://laijau.com$request_uri;
}

# --- 3. Primary Production HTTPS Server Block ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name laijau.com;

    root /var/www/laijau/current/public;
    index index.php index.html;

    # SSL / TLS Modern Cryptography
    ssl_certificate /etc/letsencrypt/live/laijau.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laijau.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Request Buffer & Upload Size Limits
    client_max_body_size 32M;
    client_body_buffer_size 128k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 16k;

    # Logging
    access_log /var/log/nginx/laijau_access.log;
    error_log /var/log/nginx/laijau_error.log warn;

    # Character set
    charset utf-8;

    # Primary Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # High-Risk / Rate Limited Endpoints
    location /checkout {
        limit_req zone=laijau_checkout burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /login {
        limit_req zone=laijau_login burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /api/ {
        limit_req zone=laijau_api burst=30 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite Fingerprinted Assets (Immutable Long-Term Caching)
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # General Static Media Assets Caching
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|css|js|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        fastcgi_pass php_fpm_laijau;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        include fastcgi_params;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_connect_timeout 10s;
        fastcgi_intercept_errors on;
    }

    # Block access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block direct access to sensitive file patterns
    location ~* \.(env|log|sql|sqlite|yml|yaml|ini|sh|bak|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block internal application directories
    location ^~ /vendor/ {
        deny all;
    }
    location ^~ /storage/logs/ {
        deny all;
    }
}
