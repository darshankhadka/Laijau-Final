# ==============================================================================
# Laijau ERP — Isolated Staging Sandbox Environment
# Mirroring Production Architecture on Isolated Ports (8080 / 8443)
# ==============================================================================

version: '3.8'

services:
  staging-app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: production
    image: laijau-app:staging
    container_name: laijau_staging_app
    restart: unless-stopped
    env_file:
      - deploy/staging/.env.staging
    volumes:
      - staging_storage_data:/var/www/laijau/storage/app
    networks:
      - laijau_staging_network
    depends_on:
      - staging-db
      - staging-redis

  staging-web:
    image: nginx:1.25-alpine
    container_name: laijau_staging_web
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./deploy/nginx/laijau.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/laijau/public:ro
      - staging_storage_data:/var/www/laijau/storage/app:ro
    networks:
      - laijau_staging_network
    depends_on:
      - staging-app

  staging-db:
    image: mysql:8.0
    container_name: laijau_staging_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: staging_root_secret
      MYSQL_DATABASE: laijau_staging
      MYSQL_USER: staging_user
      MYSQL_PASSWORD: staging_password_secret
    volumes:
      - staging_db_data:/var/lib/mysql
    networks:
      - laijau_staging_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  staging-redis:
    image: redis:7.2-alpine
    container_name: laijau_staging_redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "staging_redis_secret" ]
    volumes:
      - staging_redis_data:/data
    networks:
      - laijau_staging_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  staging-worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: production
    container_name: laijau_staging_worker
    restart: unless-stopped
    env_file:
      - deploy/staging/.env.staging
    command: [ "php", "artisan", "queue:work", "redis", "--queue=fulfillment,orders,emails,default", "--tries=3", "--backoff=5,15,60", "--timeout=90" ]
    volumes:
      - staging_storage_data:/var/www/laijau/storage/app
    networks:
      - laijau_staging_network
    depends_on:
      - staging-app
      - staging-redis

networks:
  laijau_staging_network:
    driver: bridge

volumes:
  staging_storage_data:
    driver: local
  staging_db_data:
    driver: local
  staging_redis_data:
    driver: local
